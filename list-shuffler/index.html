<h1>List shuffler</h1><aside class="ad-slot" data-ad hidden aria-label="Advertisement"></aside>
<div class="tool-panel">
  <textarea id="text">one
two
three
four</textarea>
  <button type="button" class="primary" id="go">Shuffle</button>
</div>
<script>
document.getElementById('go').onclick=()=>{
  const a=document.getElementById('text').value.split(/\n/);
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(crypto.getRandomValues(new Uint32Array(1))[0]/4294967296*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  document.getElementById('text').value=a.join('\n');
};
</script><section class="prose seo-content" aria-label="Guide and FAQ"><h2>Randomize lines</h2><p>Fisher–Yates shuffle in browser.</p></section>
