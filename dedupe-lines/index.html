<h1>Remove duplicate lines</h1><aside class="ad-slot" data-ad hidden aria-label="Advertisement"></aside>
<div class="tool-panel">
  <textarea id="text"></textarea>
  <button type="button" class="primary" id="go">Remove duplicates</button>
</div>
<script>
document.getElementById('go').onclick=()=>{
  const seen=new Set(), out=[];
  for(const line of document.getElementById('text').value.split(/\n/)){
    const k=line.trim();
    if(seen.has(k)) continue;
    seen.add(k); out.push(line);
  }
  document.getElementById('text').value=out.join('\n');
};
</script><section class="prose seo-content" aria-label="Guide and FAQ"><h2>Clean lists</h2><p>Keeps the first occurrence of each line.</p></section>
