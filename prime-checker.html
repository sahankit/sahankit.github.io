<h1>Prime checker</h1><aside class="ad-slot" data-ad hidden aria-label="Advertisement"></aside>
<div class="tool-panel">
  <label for="n">Number</label><input id="n" type="number" value="97" />
  <button type="button" class="primary" id="go">Check</button>
  <p id="out" class="ok"></p>
</div>
<script>
function isPrime(n){
  if(n<2) return false;
  if(n%2===0) return n===2;
  for(let i=3;i*i<=n;i+=2) if(n%i===0) return false;
  return true;
}
document.getElementById('go').onclick=()=>{
  const n=Number(document.getElementById('n').value);
  document.getElementById('out').textContent=isPrime(n)?n+' is prime.':n+' is not prime.';
};
document.getElementById('go').click();
</script><section class="prose seo-content" aria-label="Guide and FAQ"><h2>Primality test</h2><p>Trial division for moderate integers.</p></section>
