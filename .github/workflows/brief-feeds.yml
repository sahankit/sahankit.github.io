name: Update news brief feeds

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch RSS snapshots
        run: node fetch-brief-feeds.mjs assets/brief-feeds.json
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/brief-feeds.json
          git diff --staged --quiet || git commit -m "Update news brief RSS snapshot."
          git push
